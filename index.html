    <link rel="icon" href="/project_lumiere/logo/lumiere-logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/project_lumiere/logo/lumiere-logo.png">
    <meta name="apple-mobile-web-app-title" content="Lumiere" />

    <meta property="og:title" content="Lumiere - Descobre Filmes e Séries de Qualidade" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/project_lumiere/placeholder-og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
